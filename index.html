<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>木工製作シミュレーション（3D組立・材料取図）</title>
    <!-- Tailwind CSSの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Three.js 3Dライブラリの読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { font-family: 'Noto Sans JP', 'Inter', sans-serif; }
        
        /* A3横1ページに完全に収めるための印刷スタイル (余白なし・用紙いっぱいに最大化・右切れ防止) */
        @media print {
            @page {
                size: A3 landscape;
                margin: 0mm;
            }
            body, html {
                background-color: white !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                margin: 0 !important;
                padding: 0 !important;
                width: 420mm !important;
                height: 297mm !important;
                overflow: hidden !important;
            }
            header, main, #custom-modal, #pdf-layout-modal > div > div:first-child {
                display: none !important;
            }
            #pdf-layout-modal {
                position: fixed !important;
                top: 0 !important;
                left: 0 !important;
                width: 420mm !important;
                height: 297mm !important;
                background: white !important;
                display: flex !important;
                align-items: center !important;
                justify-content: flex-start !important;
                padding: 0 !important;
                margin: 0 !important;
                z-index: 9999 !important;
                overflow: hidden !important;
            }
            #pdf-layout-modal > div {
                max-height: none !important;
                max-width: none !important;
                box-shadow: none !important;
                border: none !important;
                width: 420mm !important;
                height: 297mm !important;
                margin: 0 !important;
                border-radius: 0 !important;
            }
            #pdf-preview-sheet {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                width: 420mm !important;
                height: 297mm !important;
            }
            #pdf-sheet-inner {
                width: 416mm !important;
                height: 293mm !important;
                box-shadow: none !important;
                border: none !important;
                padding: 4mm !important;
                margin: 0 !important;
                page-break-after: avoid !important;
                page-break-before: avoid !important;
                page-break-inside: avoid !important;
                transform: none !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
            }
        }
    </style>
</head>
